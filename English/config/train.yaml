path:
  ckpt_path: ./English/checkpoints
  log_path: ./English/logs
  result_path: ./Results/English
optimizer:
  batch_size: 8
  betas:
  - 0.9
  - 0.98
  eps: 1.0e-09
  weight_decay: 0.0
  grad_clip_thresh: 1.0
  grad_acc_step: 1
  warm_up_step: 10
  anneal_steps:
  - 3000
  - 5000
  - 7000
  anneal_rate: 0.3
step:
  total_step: 20
  log_step: 1
  synth_step: 999999
  val_step: 999999
  save_step: 10
